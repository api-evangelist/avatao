name: Avatao
description: Avatao is a secure-coding and secure-development training platform that gives software
  engineers hands-on, gamified security education through interactive challenges, guided tutorials, and
  language-specific labs covering the OWASP Top 10 and real-world vulnerability classes. Aimed at
  enterprise development teams, it measures and improves secure-coding skills to reduce vulnerabilities
  before code ships. Founded in Budapest, Hungary, Avatao is backed by 500 Global and Speedinvest. It
  was surfaced as a portfolio-company lead and is being profiled in the API Evangelist network; the
  company exposes challenge-authoring tooling and SDKs on GitHub but publishes no public product API.
